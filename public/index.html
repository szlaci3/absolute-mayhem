<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121412"><title>Absolute Mayhem — World Studio</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/" aria-label="Absolute Mayhem home"><svg viewBox="0 0 40 40" width="35" height="35" aria-hidden="true"><path fill="currentColor" d="M20 0l3.5 12 8-7-3 11 11-2-9 8 8 5-13-1 2 12-8-10-7 11 1-14-12 4 9-9-10-5 13 1-3-12 8 9z"/></svg>Absolute Mayhem</a><span class="header-tag">WORLD STUDIO</span><div class="spacer"></div><span class="saved" id="saved">● &nbsp; Local save</span><button class="help" id="help" aria-label="Studio controls">?</button></header>
<main><div class="eyebrow"><i></i> WORLD WORKSPACE</div><div class="heading"><h1>The Flooded Observatory</h1><button id="journal" class="subtle"><span>☷</span> Journal</button></div>
<div class="studio"><section class="viewport panel"><div class="panelhead"><strong><b class="icon">⌖</b> World viewport</strong><span class="live"><i></i> SIMULATION LIVE</span></div><div class="scene"><canvas tabindex="0" id="scene" aria-label="Playable isometric observatory. Arrow keys move and E interacts."></canvas><div class="scene-tag">✧ &nbsp; SECTOR 01 <span>/</span> TIDAL RUINS</div><div class="coords" id="coords"></div></div><div class="controls"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span><span><kbd>E</kbd> Interact</span><span class="pointer">⌖ &nbsp; Click to walk</span><button id="interact">Interact →</button></div></section>
<aside class="panel editor"><div class="panelhead"><strong><b class="icon">✧</b> Rule composer</strong></div><div class="editorbody"><h2>Shape the world.</h2><label for="prompt">Describe a mechanic or change an existing rule.</label><textarea id="prompt" maxlength="1000" placeholder="Add a bell that lights the bridge for 8 seconds…"></textarea><button id="apply" class="primary">✧ &nbsp; Apply mechanic <span>→</span></button><div class="examplelabel">TRY A PROMPT</div><div id="examples"></div><div class="provider"><span class="dot"></span><div><b id="mode">Local compiler</b><small id="model"></small></div><button id="details" aria-label="Model details">ⓘ</button></div></div></aside>
<section class="panel objective"><div class="emblem">✴</div><div><div class="eyebrow coral" id="progress">FIELD OBJECTIVE · 01 / 03</div><h3 id="objective"></h3><p id="message"></p></div></section>
<section class="panel rules"><div class="panelhead"><strong><b class="icon">≋</b> World inspector</strong><button class="subtle" id="undo">↶ Undo edit</button></div><div class="tabs"><button data-tab="rules" class="active">Rules</button><button data-tab="entities">Objects</button><button data-tab="vars">State</button><button data-tab="trace">Events</button><span id="revision"></span></div><div id="list"></div></section></div></main>
<dialog><div class="panelhead"><strong id="dialogtitle"></strong><button id="close" aria-label="Close">×</button></div><div id="dialogbody"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
